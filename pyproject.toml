[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steamview"
version = "0.1.0"
description = "Backend media resolver for the SteamView Decky plugin"
requires-python = ">=3.11"
# Intentionally empty: the plugin backend is Python standard library only.
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["py_modules", "."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

[tool.setuptools]
packages = ["steamview"]
package-dir = { "" = "py_modules" }

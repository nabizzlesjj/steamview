name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup errors out if a
      # version is given in both places, and package.json's
      # `packageManager` is the better authority: it pins an exact
      # 9.15.9 rather than a floating 9.x, so CI and a developer's
      # machine resolve identically.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Pure-arithmetic overlay sizing, run against every display Game
      # Mode ships on. No test framework: node's own runner, over the
      # module compiled by the TypeScript already installed here.
      - name: Test
        run: pnpm run test:fe

      - name: Build
        run: pnpm run build

      - name: Verify the bundle was produced
        run: test -s dist/index.js

      # Publish an installable build from every push, on any branch.
      # A source download is not installable -- it has no dist/index.js,
      # which is an easy and confusing trap -- so without this the only
      # way to get a working ZIP is to cut a release. That makes testing
      # a branch before releasing it impossible, which is backwards.
      - name: Assemble the plugin ZIP
        run: python3 scripts/package.py --out-dir out

      - name: Upload the installable plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SteamView-plugin-zip
          path: out/*.zip
          if-no-files-found: error

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SteamOS ships 3.11; the upper bound guards against future drift.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        # The plugin backend itself has zero dependencies; pytest is the
        # only thing CI needs to add.
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest

      - name: Assert the backend imports nothing outside the stdlib
        run: python scripts/check_stdlib_only.py

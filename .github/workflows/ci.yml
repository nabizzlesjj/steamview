name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup errors out if a
      # version is given in both places, and package.json's
      # `packageManager` is the better authority: it pins an exact
      # 9.15.9 rather than a floating 9.x, so CI and a developer's
      # machine resolve identically.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Verify the bundle was produced
        run: test -s dist/index.js

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SteamOS ships 3.11; the upper bound guards against future drift.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        # The plugin backend itself has zero dependencies; pytest is the
        # only thing CI needs to add.
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest

      - name: Assert the backend imports nothing outside the stdlib
        run: python scripts/check_stdlib_only.py

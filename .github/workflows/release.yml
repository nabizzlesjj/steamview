name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be cut entirely from the Actions tab, with no local
  # clone and no git CLI. The tag is created as part of publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup errors out if a
      # version is given in both places, and package.json's
      # `packageManager` is the better authority: it pins an exact
      # 9.15.9 rather than a floating 9.x, so CI and a developer's
      # machine resolve identically.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve the release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a semver tag. Use vMAJOR.MINOR.PATCH, e.g. v0.1.0."
            exit 1
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      # The ZIP is named from package.json's version, so a tag that
      # disagrees with it would publish SteamView-v0.1.0.zip under a
      # v0.2.0 release. Catch that here rather than after it ships.
      - name: Check the tag matches package.json
        run: |
          pkg="v$(python3 -c "import json; print(json.load(open('package.json'))['version'])")"
          tag="${{ steps.tag.outputs.name }}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag $tag does not match package.json version $pkg."
            echo "::error::Bump \"version\" in package.json (and add a CHANGELOG entry) first."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify before shipping
        run: |
          pnpm run typecheck
          pnpm run lint
          python -m pip install --upgrade pip pytest
          python -m pytest

      - name: Build the frontend
        run: pnpm run build

      - name: Assemble the plugin ZIP
        id: package
        run: python scripts/package.py --out-dir out

      - name: Upload the ZIP as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/*.zip
          if-no-files-found: error

      # Creates the tag too when it does not already exist, which is what
      # makes the workflow_dispatch path work without a local clone.
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: SteamView ${{ steps.tag.outputs.name }}
          files: out/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

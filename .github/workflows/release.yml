name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a manual re-run)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup errors out if a
      # version is given in both places, and package.json's
      # `packageManager` is the better authority: it pins an exact
      # 9.15.9 rather than a floating 9.x, so CI and a developer's
      # machine resolve identically.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify before shipping
        run: |
          pnpm run typecheck
          pnpm run lint
          python -m pip install --upgrade pip pytest
          python -m pytest

      - name: Build the frontend
        run: pnpm run build

      - name: Assemble the plugin ZIP
        id: package
        run: python scripts/package.py --out-dir out

      - name: Upload the ZIP as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: out/*.zip
          if-no-files-found: error

      - name: Attach the ZIP to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
